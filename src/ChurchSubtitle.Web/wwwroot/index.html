<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>실시간 예배 자막</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main class="broadcast-shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">LIVE CAPTION MONITOR</p>
        <h1>실시간 예배 자막</h1>
      </div>
      <div class="masthead-side">
        <p class="source-time">현재 위치에서 시작</p>
        <a class="output-link" href="/output.html" target="_blank" rel="noopener">송출 화면 열기</a>
      </div>
    </header>

    <section class="video-panel" aria-label="원본 예배 영상">
      <div class="video-frame">
        <div id="player"></div>
      </div>
    </section>

    <section class="control-bar" aria-label="자막 테스트 제어">
      <div class="field-group">
        <label for="delay">자막 지연</label>
        <select id="delay" name="delay">
          <option value="low" selected>낮음</option>
          <option value="medium">보통</option>
          <option value="high">높음</option>
        </select>
      </div>

      <div class="button-group">
        <button id="start-button" class="button button-primary" type="button">시작</button>
        <button id="stop-button" class="button button-secondary" type="button" disabled>중지</button>
      </div>

      <div id="status-badge" class="status-badge" data-state="idle" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">대기</span>
      </div>
    </section>

    <section class="caption-stage" aria-labelledby="caption-heading">
      <div class="caption-stage-header">
        <div>
          <p class="eyebrow">ON-AIR TRANSCRIPT</p>
          <h2 id="caption-heading">현재 자막</h2>
        </div>
        <span id="live-indicator" class="live-mark" data-state="idle" aria-hidden="true">대기</span>
      </div>

      <div id="caption-lines" class="caption-lines" aria-live="polite" aria-atomic="false">
        <p id="caption-text" class="caption-text" aria-label="실시간 자막">시작하면 이곳에 자막이 표시됩니다.</p>
      </div>
    </section>

    <section class="editor-panel" aria-label="자막 수정과 수동 개입">
      <div class="editor-header">
        <div>
          <p class="eyebrow">OPERATOR DESK</p>
          <h2>자막 수정</h2>
        </div>
        <p class="editor-hint">줄을 클릭해 수정하세요. 수정한 줄은 AI가 다시 바꾸지 않으며, 비우고 확정하면 삭제됩니다.</p>
      </div>

      <div id="final-list" class="final-list" role="list" aria-label="최근 확정 자막"></div>

      <form id="edit-form" class="edit-form" hidden>
        <label for="edit-input">선택한 줄 수정</label>
        <div class="edit-row">
          <input id="edit-input" type="text" autocomplete="off" spellcheck="false">
          <button type="submit" class="button button-primary">확정</button>
          <button id="edit-cancel" type="button" class="button button-secondary">취소</button>
        </div>
      </form>

      <form id="manual-form" class="manual-form">
        <label for="manual-input">수동 자막</label>
        <input id="manual-input" type="text" autocomplete="off" spellcheck="false"
          placeholder="자막 입력 후 Enter — AI 오류나 장애 시 바로 개입">
      </form>
    </section>

    <p class="privacy-note">영상을 원하는 위치로 이동한 뒤 시작하세요. 오디오는 브라우저에서 로컬 자막 서버를 거쳐 OpenAI로 전송되어 전사됩니다. API 키는 로컬 서버에만 보관됩니다.</p>
  </main>
</body>
</html>
